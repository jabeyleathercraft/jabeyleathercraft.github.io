<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders — Jabey Leather Craft</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #f6f2ec;
            color: #2b211b;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }

        button,
        input,
        select {
            font-family: inherit;
        }


        /* HEADER */

        header {
            padding: 30px 7%;
            border-bottom: 1px solid #d9cec2;
        }

        .header-inner {
            max-width: 1250px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 24px;
            letter-spacing: 5px;
        }

        .header-label {
            color: #8a6040;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }


        /* NAVIGATION */

        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 20px;
            padding: 21px;

            border-bottom: 1px solid #d9cec2;

            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .navigation a {
            color: inherit;
            text-decoration: none;
        }

        .navigation span {
            color: #9b8776;
        }


        /* INTRO */

        .orders-intro {
            max-width: 1250px;
            margin: auto;

            padding: 90px 7% 60px;
        }

        .orders-label {
            display: flex;
            align-items: center;
            gap: 18px;

            margin-bottom: 40px;

            color: #8a6040;

            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .orders-line {
            width: 65px;
            height: 1px;
            background: #9a7658;
        }

        .orders-intro h1 {
            font-size: clamp(55px, 8vw, 100px);
            line-height: .9;

            font-weight: normal;
            letter-spacing: -4px;
        }

        .orders-intro h1 em {
            color: #765d49;
            font-style: italic;
        }


        /* LOGIN */

        .login-section {
            max-width: 500px;
            margin: 0 auto;

            padding: 20px 25px 120px;
        }

        .login-box {
            padding: 40px;

            background: #ebe3d9;

            border: 1px solid #d8cabc;
        }

        .login-box h2 {
            margin-bottom: 30px;

            font-size: 28px;
            font-weight: normal;
        }

        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            color: #765d49;

            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .field input {
            width: 100%;

            padding: 14px;

            border: 1px solid #cdbfb0;

            background: #f6f2ec;
            color: #2b211b;

            outline: none;
        }

        .login-button {
            width: 100%;

            padding: 16px;

            border: none;

            background: #2b211b;
            color: #f6f2ec;

            cursor: pointer;

            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .login-button:hover {
            background: #8a6040;
        }

        .error {
            margin-top: 15px;

            color: #9a4f3d;

            font-size: 13px;
        }


        /* ORDERS */

        .orders-section {
            max-width: 1250px;

            margin: auto;

            padding: 20px 7% 120px;
        }

        .orders-top {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        .orders-top h2 {
            font-size: 32px;
            font-weight: normal;
        }

        .logout-button {
            padding: 12px 20px;

            border: 1px solid #2b211b;

            background: transparent;
            color: #2b211b;

            cursor: pointer;

            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .logout-button:hover {
            background: #2b211b;
            color: #f6f2ec;
        }

        .orders-list {
            border-top: 1px solid #d9cec2;
        }

        .order-card {
            margin-bottom: 25px;
            padding: 30px;

            background: #ebe3d9;

            border: 1px solid #d8cabc;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            gap: 20px;

            padding-bottom: 20px;

            border-bottom: 1px solid #d3c4b5;
        }

        .order-number {
            font-size: 20px;
        }

        .order-date {
            margin-top: 7px;

            color: #8a7565;

            font-size: 12px;
        }

        .order-status {
            padding: 8px 12px;

            border: 1px solid #bca995;

            background: #f6f2ec;

            color: #765d49;

            font-size: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .order-details {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;

            padding-top: 25px;
        }

        .detail-title {
            margin-bottom: 6px;

            color: #8a6040;

            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .detail-value {
            font-size: 14px;
            line-height: 1.6;
        }

        .order-products {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #d3c4b5;
        }

        .order-products h3 {
            margin-bottom: 12px;

            color: #8a6040;

            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .product-row {
            display: flex;

            justify-content: space-between;

            gap: 20px;

            padding: 8px 0;

            font-size: 13px;
        }

        .order-total {
            display: flex;

            justify-content: space-between;

            margin-top: 20px;

            padding-top: 20px;

            border-top: 1px solid #d3c4b5;

            font-size: 19px;
        }

        .status-control {
            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #d3c4b5;
        }

        .status-control label {
            display: block;

            margin-bottom: 8px;

            color: #8a6040;

            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .status-control select {
            padding: 12px;

            border: 1px solid #cdbfb0;

            background: #f6f2ec;
            color: #2b211b;
        }

        .save-status {
            margin-left: 10px;

            padding: 12px 18px;

            border: none;

            background: #2b211b;
            color: #f6f2ec;

            cursor: pointer;

            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }


        /* EMPTY */

        .no-orders {
            padding: 70px 30px;

            border-top: 1px solid #d9cec2;
            border-bottom: 1px solid #d9cec2;

            text-align: center;

            color: #765d49;
        }


        /* LOADING */

        .loading {
            padding: 60px;

            text-align: center;

            color: #765d49;

            font-size: 13px;
        }


        /* FOOTER */

        footer {
            padding: 70px 7% 30px;

            background: #201711;

            color: #b8a79a;
        }

        .footer-inner {
            max-width: 1250px;
            margin: auto;
        }

        .footer-brand {
            margin-bottom: 35px;

            color: #f4ede5;

            font-size: 25px;
            letter-spacing: 5px;
        }

        .footer-bottom {
            display: flex;
            justify-content: space-between;

            padding-top: 25px;

            border-top: 1px solid rgba(255,255,255,.12);

            color: #806f62;

            font-size: 10px;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            header {
                padding: 25px 20px;
            }

            .brand {
                font-size: 19px;
                letter-spacing: 3px;
            }

            .header-label {
                font-size: 8px;
            }

            .navigation {
                gap: 9px;

                padding: 18px 10px;

                font-size: 9px;
                letter-spacing: 1px;
            }

            .orders-intro {
                padding: 70px 25px 45px;
            }

            .orders-intro h1 {
                font-size: 60px;
                letter-spacing: -2px;
            }

            .orders-section {
                padding: 20px 25px 90px;
            }

            .order-details {
                grid-template-columns: 1fr;
            }

            .order-header {
                flex-direction: column;
            }

            .orders-top {
                align-items: flex-start;
            }

            .login-section {
                padding: 20px 25px 90px;
            }

            .login-box {
                padding: 25px;
            }

            .footer-bottom {
                display: block;
                line-height: 2;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <div class="header-inner">

            <div class="brand">
                JABEY
            </div>

            <div class="header-label">
                Admin / Orders
            </div>

        </div>

    </header>


    <!-- NAVIGATION -->

    <nav class="navigation">

        <a href="index.html">
            Home
        </a>

        <span>|</span>

        <a href="shop.html">
            Shop
        </a>

        <span>|</span>

        <a href="cart.html">
            Cart
        </a>

        <span>|</span>

        <a href="orders.html">
            Orders
        </a>

    </nav>


    <!-- INTRO -->

    <section class="orders-intro">

        <div class="orders-label">

            <span>01</span>

            <div class="orders-line"></div>

            <span>Administration</span>

        </div>

        <h1>
            JLC<br>
            <em>Orders.</em>
        </h1>

    </section>


    <!-- LOGIN -->

    <section
        id="loginSection"
        class="login-section"
    >

        <div class="login-box">

            <h2>
                Admin Login
            </h2>

            <div class="field">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    autocomplete="email"
                >

            </div>

            <div class="field">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    autocomplete="current-password"
                >

            </div>

            <button
                class="login-button"
                onclick="login()"
            >
                Sign In
            </button>

            <div
                id="loginError"
                class="error"
            ></div>

        </div>

    </section>


    <!-- ORDERS -->

    <section
        id="ordersSection"
        class="orders-section"
        style="display:none;"
    >

        <div class="orders-top">

            <h2>
                Customer Orders
            </h2>

            <button
                class="logout-button"
                onclick="logout()"
            >
                Log Out
            </button>

        </div>

        <div
            id="ordersList"
            class="orders-list"
        >

            <div class="loading">
                Loading orders...
            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <div class="footer-inner">

            <div class="footer-brand">
                JABEY LEATHER CRAFT
            </div>

            <div class="footer-bottom">

                <span>
                    © 2026 Jabey Leather Craft
                </span>

                <span>
                    Private Admin Area
                </span>

            </div>

        </div>

    </footer>


    <!-- SUPABASE LIBRARY -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        const SUPABASE_URL =
            "https://gdgamwhbhsfhotkyuqpm.supabase.co";


        /*
            IMPORTANT:

            Replace the text below with the SAME
            anon/publishable key from checkout.html.

            NEVER use your service-role key here.
        */

        const SUPABASE_ANON_KEY =
            "PASTE_YOUR_EXISTING_ANON_KEY_HERE";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_ANON_KEY
            );


        /* LOGIN */

        async function login() {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();


            const password =
                document
                    .getElementById("password")
                    .value;


            const errorBox =
                document.getElementById(
                    "loginError"
                );


            errorBox.textContent = "";


            const {
                data,
                error
            } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                errorBox.textContent =
                    error.message;

                return;

            }


            showOrders();

        }


        /* SHOW ORDERS */

        async function showOrders() {

            const {
                data: {
                    session
                }
            } =
                await supabaseClient.auth.getSession();


            if (!session) {

                document.getElementById(
                    "loginSection"
                ).style.display = "block";


                document.getElementById(
                    "ordersSection"
                ).style.display = "none";


                return;

            }


            document.getElementById(
                "loginSection"
            ).style.display = "none";


            document.getElementById(
                "ordersSection"
            ).style.display = "block";


            loadOrders(
                session.access_token
            );

        }


        /* LOAD ORDERS */

        async function loadOrders(
            accessToken
        ) {

            const ordersList =
                document.getElementById(
                    "ordersList"
                );


            ordersList.innerHTML =
                '<div class="loading">Loading orders...</div>';


            try {

                const response =
                    await fetch(

                        SUPABASE_URL +
                        "/functions/v1/admin-orders",

                        {

                            method: "GET",

                            headers: {

                                "Authorization":
                                    "Bearer " +
                                    accessToken

                            }

                        }

                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error ||
                        "Unable to load orders."
                    );

                }


                displayOrders(data);


            } catch (error) {

                ordersList.innerHTML =
                    `<div class="no-orders">
                        ${error.message}
                    </div>`;

            }

        }


        /* DISPLAY ORDERS */

        function displayOrders(
            orders
        ) {

            const ordersList =
                document.getElementById(
                    "ordersList"
                );


            if (!orders.length) {

                ordersList.innerHTML =
                    `<div class="no-orders">
                        No orders yet.
                    </div>`;

                return;

            }


            ordersList.innerHTML = "";


            orders.forEach(
                function(order) {

                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "order-card";


                    const orderNumber =
                        order.order_number ||
                        "Unknown";


                    const customerName =
                        order.name ||
                        order.customer_name ||
                        "Unknown";


                    const phone =
                        order.phone ||
                        "—";


                    const address =
                        order.address ||
                        "—";


                    const payment =
                        order.payment_method ||
                        "—";


                    const status =
                        order.status ||
                        "Pending";


                    const created =
                        order.created_at
                        ?
                        new Date(
                            order.created_at
                        ).toLocaleString()
                        :
                        "—";


                    let productsHTML = "";


                    if (
                        Array.isArray(
                            order.items
                        )
                    ) {

                        order.items.forEach(
                            function(item) {

                                const itemName =
                                    item.product ||
                                    item.name ||
                                    "Product";


                                const quantity =
                                    item.quantity ||
                                    1;


                                const price =
                                    Number(
                                        item.price || 0
                                    );


                                productsHTML += `

                                    <div class="product-row">

                                        <span>
                                            ${itemName}
                                            ×
                                            ${quantity}
                                        </span>

                                        <span>
                                            MVR
                                            ${price * quantity}
                                        </span>

                                    </div>

                                `;

                            }
                        );

                    } else {

                        productsHTML =
                            `<div class="product-row">

                                <span>
                                    Order details stored in database
                                </span>

                            </div>`;

                    }


                    const total =
                        order.total ||
                        order.amount ||
                        0;


                    card.innerHTML = `

                        <div class="order-header">

                            <div>

                                <div class="order-number">
                                    ${orderNumber}
                                </div>

                                <div class="order-date">
                                    ${created}
                                </div>

                            </div>

                            <div class="order-status">
                                ${status}
                            </div>

                        </div>


                        <div class="order-details">

                            <div>

                                <div class="detail-title">
                                    Customer
                                </div>

                                <div class="detail-value">
                                    ${customerName}
                                </div>

                            </div>


                            <div>

                                <div class="detail-title">
                                    Phone
                                </div>

                                <div class="detail-value">
                                    ${phone}
                                </div>

                            </div>


                            <div>

                                <div class="detail-title">
                                    Address
                                </div>

                                <div class="detail-value">
                                    ${address}
                                </div>

                            </div>


                            <div>

                                <div class="detail-title">
                                    Payment
                                </div>

                                <div class="detail-value">
                                    ${payment}
                                </div>

                            </div>

                        </div>


                        <div class="order-products">

                            <h3>
                                Products
                            </h3>

                            ${productsHTML}

                        </div>


                        <div class="order-total">

                            <span>
                                Total
                            </span>

                            <span>
                                MVR ${total}
                            </span>

                        </div>


                        <div class="status-control">

                            <label>
                                Change Status
                            </label>

                            <select
                                id="status-${orderNumber}"
                            >

                                <option
                                    value="Pending"
                                    ${status === "Pending" ? "selected" : ""}
                                >
                                    Pending
                                </option>

                                <option
                                    value="Confirmed"
                                    ${status === "Confirmed" ? "selected" : ""}
                                >
                                    Confirmed
                                </option>

                                <option
                                    value="Processing"
                                    ${status === "Processing" ? "selected" : ""}
                                >
                                    Processing
                                </option>

                                <option
                                    value="Shipped"
                                    ${status === "Shipped" ? "selected" : ""}
                                >
                                    Shipped
                                </option>

                                <option
                                    value="Delivered"
                                    ${status === "Delivered" ? "selected" : ""}
                                >
                                    Delivered
                                </option>

                                <option
                                    value="Cancelled"
                                    ${status === "Cancelled" ? "selected" : ""}
                                >
                                    Cancelled
                                </option>

                            </select>


                            <button
                                class="save-status"
                                onclick="updateStatus('${orderNumber}')"
                            >
                                Save
                            </button>

                        </div>

                    `;


                    ordersList.appendChild(
                        card
                    );

                }
            );

        }


        /* STATUS UPDATE */

        async function updateStatus(
            orderNumber
        ) {

            alert(
                "Status updating will be connected in the next step."
            );

        }


        /* LOGOUT */

        async function logout() {

            await supabaseClient.auth.signOut();


            document.getElementById(
                "ordersSection"
            ).style.display = "none";


            document.getElementById(
                "loginSection"
            ).style.display = "block";

        }


        /* CHECK EXISTING LOGIN */

        showOrders();

    </script>

</body>

</html>
