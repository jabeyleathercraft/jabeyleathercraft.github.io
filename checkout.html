<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Jabey Leather Craft</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f5f0;
      color: #222;
    }

    .checkout-box {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
    }

    .buy-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #222;
    }
  </style>
</head>

<body>

  <div class="checkout-box">

    <h1>Checkout</h1>

    <p><strong>Product:</strong> <span id="productName">Your Product</span></p>
    <p><strong>Price:</strong> MVR <span id="productPrice">0</span></p>

    <label>Quantity</label>
    <input type="number" id="quantity" value="1" min="1">

    <label>Full Name</label>
    <input type="text" id="customerName" required>

    <label>Phone Number</label>
    <input type="tel" id="customerPhone" required>

    <label>Delivery Address</label>
    <textarea id="customerAddress" required></textarea>

    <button class="buy-button" onclick="placeOrder()">
      BUY NOW
    </button>

    <a href="index.html" class="back">← Back to Shop</a>

  </div>

  <script>

    const params = new URLSearchParams(window.location.search);

    const product = params.get("product") || "Your Product";
    const price = Number(params.get("price")) || 0;

    document.getElementById("productName").textContent = product;
    document.getElementById("productPrice").textContent = price;

    function placeOrder() {

      const quantity =
        document.getElementById("quantity").value;

      const name =
        document.getElementById("customerName").value;

      const phone =
        document.getElementById("customerPhone").value;

      const address =
        document.getElementById("customerAddress").value;

      if (!name || !phone || !address) {
        alert("Please fill in all your details.");
        return;
      }

      const total = price * quantity;

      const message =
        "NEW ORDER - JABEY LEATHER CRAFT\n\n" +
        "Product: " + product + "\n" +
        "Price: MVR " + price + "\n" +
        "Quantity: " + quantity + "\n" +
        "Total: MVR " + total + "\n\n" +
        "Customer: " + name + "\n" +
        "Phone: " + phone + "\n" +
        "Address: " + address;

      const whatsapp =
        "https://wa.me/9609878207?text=" +
        encodeURIComponent(message);

      window.location.href = whatsapp;
    }

  </script>

</body>
</html>
