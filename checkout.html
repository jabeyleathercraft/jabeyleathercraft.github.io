<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Jabey Leather Craft</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f5f0;
      color: #222;
    }

    .checkout-box {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
    }

    .buy-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #222;
    }
    #loadingOverlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(36, 24, 17, 0.92);
    z-index: 9999;
    align-items: center;
    justify-content: center;
}

.loadingBox {
    text-align: center;
    color: white;
    font-family: Georgia, "Times New Roman", serif;
}

.loadingRing {
    width: 42px;
    height: 42px;
    border: 3px solid rgba(201, 167, 125, 0.3);
    border-top: 3px solid #c9a77d;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
    margin: 0 auto 20px;
}

.loadingBox p {
    margin: 0;
    font-size: 17px;
    letter-spacing: 1.5px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
  </style>
</head>

<body>
<div id="loadingOverlay">
    <div class="loadingBox">
        <div class="loadingRing"></div>
        <p>Preparing your order...</p>
    </div>
</div>
  <div class="checkout-box">

    <h1>Checkout</h1>

 <div id="cartCheckoutItems"></div>

<div style="margin-top:20px; padding:15px; background:#f5f5f5; border-radius:8px;">
  <strong>Order Total:</strong>
  MVR <span id="cartCheckoutTotal">0</span>
</div>

    <label>Quantity</label>
  <input type="number" id="quantity" min="1">

    <label>Full Name</label>
    <input type="text" id="customerName" required>

    <label>Phone Number</label>
    <input type="tel" id="customerPhone" required>

    <label>Delivery Address</label>
<textarea id="customerAddress" required></textarea>

<label>Payment Method</label>

<select id="paymentMethod" onchange="showPaymentDetails()">
  <option value="">Select Payment Method</option>
  <option value="bml">BML Bank Transfer</option>
  <option value="mib">MIB Bank Transfer</option>
  <option value="cod">Cash on Delivery</option>
</select>

<div id="bankDetails" style="display:none; margin-top:20px; padding:15px; background:#f5f5f5; border-radius:8px;">

  <p><strong>Bank Transfer Details</strong></p>

  <p id="bmlDetails" style="display:none;">
    <strong>BML</strong><br>
    Account Name: Jazlaan Mohamed<br>
    Account Number: 7730000298250
  </p>

  <p id="mibDetails" style="display:none;">
    <strong>MIB</strong><br>
    Account Name: Jazlaan Mohamed<br>
    Account Number: 90403101000351000
  </p>

  <label>Upload Payment Slip</label>
  <input type="file" id="paymentSlip" accept="image/*,.pdf">

</div>

<div id="codDetails" style="display:none; margin-top:20px; padding:15px; background:#f5f5f5; border-radius:8px;">
  <strong>Cash on Delivery</strong>
  <p>You can pay when your order is delivered.</p>
</div>

<button class="buy-button" onclick="placeOrder()">
  PLACE ORDER
</button>

    <a href="index.html" class="back">← Back to Shop</a>

  </div>

  <script>
const SUPABASE_URL = "https://gdgamwhbhsfhotkyuqpm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2cfZhbCK5";
    const ORDERS_URL =
  SUPABASE_URL + "/rest/v1/orders";
const UPLOAD_FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/Upload-payment-slip";
    

    const params = new URLSearchParams(window.location.search);

const singleProduct =
  params.get("product") || "";

const singlePrice =
  Number(params.get("price")) || 0;

const singleColor =
  params.get("color") || "";

const singleCustomisation =
  params.get("customisation") || "";

const singleQuantity =
  Number(params.get("quantity")) || 1;

let checkoutCart =
  JSON.parse(localStorage.getItem("checkoutCart")) || [];

if (checkoutCart.length === 0 && singleProduct) {

  checkoutCart = [{
    product: singleProduct,
    price: singlePrice,
    color: singleColor,
    customisation: singleCustomisation,
    quantity: singleQuantity
  }];

}

function displayCheckoutCart() {

  const container =
    document.getElementById("cartCheckoutItems");

  container.innerHTML = "";

  let total = 0;

  checkoutCart.forEach(function(item) {

    const itemTotal =
      item.price * item.quantity;

    total += itemTotal;

    const div =
      document.createElement("div");

    div.style.marginBottom = "20px";
    div.style.padding = "15px";
    div.style.background = "#f5f5f5";
    div.style.borderRadius = "8px";

    div.innerHTML = `
      <strong>${item.product}</strong>

      <p>
        Price: MVR ${item.price}
      </p>

      <p>
        Quantity: ${item.quantity}
      </p>

      <p>
        Color: ${item.color || "Not selected"}
      </p>

      <p>
        Customisation:
        ${item.customisation || "None"}
      </p>

      <strong>
        Item Total: MVR ${itemTotal}
      </strong>
    `;

    container.appendChild(div);

  });

  document.getElementById("cartCheckoutTotal").textContent =
    total;
}

displayCheckoutCart();
function showPaymentDetails() {

  const paymentMethod =
    document.getElementById("paymentMethod").value;

  const bankDetails =
    document.getElementById("bankDetails");

  const bmlDetails =
    document.getElementById("bmlDetails");

  const mibDetails =
    document.getElementById("mibDetails");

  const codDetails =
    document.getElementById("codDetails");

  bankDetails.style.display = "none";
  bmlDetails.style.display = "none";
  mibDetails.style.display = "none";
  codDetails.style.display = "none";

  if (paymentMethod === "bml") {
    bankDetails.style.display = "block";
    bmlDetails.style.display = "block";
  }

  if (paymentMethod === "mib") {
    bankDetails.style.display = "block";
    mibDetails.style.display = "block";
  }

  if (paymentMethod === "cod") {
    codDetails.style.display = "block";
  }
}
    async function placeOrder() {

  const name =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("customerPhone").value.trim();

  const address =
    document.getElementById("customerAddress").value.trim();

  const paymentMethod =
    document.getElementById("paymentMethod").value;

  const paymentSlipInput =
    document.getElementById("paymentSlip");

  const paymentSlip =
    paymentSlipInput ? paymentSlipInput.files[0] : null;


  if (!name || !phone || !address) {
    alert("Please fill in all your details.");
    return;
  }

  if (!paymentMethod) {
    alert("Please select a payment method.");
    return;
  }

  if (
    (paymentMethod === "bml" || paymentMethod === "mib")
    && !paymentSlip
  ) {
    alert("Please upload your payment slip.");
    return;
  }

  if (!checkoutCart || checkoutCart.length === 0) {
    alert("Your cart is empty.");
    return;
  }


  document.getElementById("loadingOverlay").style.display = "flex";


  const orderNumber =
    "JLC-" +
    Date.now().toString().slice(-8);


  let paymentText = "";

  if (paymentMethod === "bml") {
    paymentText = "BML Bank Transfer";
  }

  if (paymentMethod === "mib") {
    paymentText = "MIB Bank Transfer";
  }

  if (paymentMethod === "cod") {
    paymentText = "Cash on Delivery";
  }


  let slipFileName = "";


  if (paymentSlip) {

    try {

      const formData = new FormData();

      formData.append("file", paymentSlip);

      const response = await fetch(
        UPLOAD_FUNCTION_URL,
        {
          method: "POST",
          headers: {
            "Authorization":
              "Bearer " + SUPABASE_ANON_KEY,

            "apikey":
              SUPABASE_ANON_KEY
          },
          body: formData
        }
      );


      const result =
        await response.json();


      if (!response.ok) {

        throw new Error(
          result.error || "Upload failed."
        );

      }


      slipFileName =
        result.fileName;


    } catch (error) {

      document.getElementById("loadingOverlay").style.display = "none";

      alert(
        "UPLOAD ERROR: " + error.message
      );

      return;
    }
  }


  let orderRows = [];


  checkoutCart.forEach(function(item) {

    const itemTotal =
      Number(item.price) * Number(item.quantity);


    orderRows.push({

      order_number: orderNumber,

      product: item.product,

      price: Number(item.price),

      color: item.color || "",

      customisation:
        item.customisation || "",

      quantity: Number(item.quantity),

      total: itemTotal,

      customer_name: name,

      customer_phone: phone,

      delivery_address: address,

      payment_method: paymentText,

      payment_slip: slipFileName

    });

  });


  try {

    const orderResponse =
      await fetch(
        ORDERS_URL,
        {
          method: "POST",

          headers: {
            "apikey":
              SUPABASE_ANON_KEY,

            "Authorization":
              "Bearer " + SUPABASE_ANON_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"
          },

          body:
            JSON.stringify(orderRows)
        }
      );


    if (!orderResponse.ok) {

      const errorText =
        await orderResponse.text();

      throw new Error(
        errorText ||
        "Order could not be saved."
      );
    }


  } catch (error) {

    document.getElementById("loadingOverlay").style.display = "none";

    alert(
      "ORDER ERROR: " + error.message
    );

    return;
  }


  let message =
    "NEW ORDER - JABEY LEATHER CRAFT\n\n" +

    "Order Number: " +
    orderNumber +
    "\n\n";


  let grandTotal = 0;


  checkoutCart.forEach(function(item, index) {

    const itemTotal =
      Number(item.price) *
      Number(item.quantity);

    grandTotal += itemTotal;


    message +=
      (index + 1) +
      ". " +
      item.product +
      "\n";

    message +=
      "Price: MVR " +
      item.price +
      "\n";

    message +=
      "Quantity: " +
      item.quantity +
      "\n";

    message +=
      "Color: " +
      (item.color || "Not selected") +
      "\n";

    message +=
      "Customisation: " +
      (item.customisation || "None") +
      "\n";

    message +=
      "Item Total: MVR " +
      itemTotal +
      "\n\n";

  });


  message +=
    "TOTAL: MVR " +
    grandTotal +
    "\n\n" +

    "Customer: " +
    name +
    "\n" +

    "Phone: " +
    phone +
    "\n" +

    "Address: " +
    address +
    "\n\n" +

    "Payment Method: " +
    paymentText +
    "\n" +

    (
      slipFileName
        ? "Payment Slip: Uploaded"
        : "Payment Slip: Not Required"
    );


  const whatsapp =
    "https://wa.me/9609878207?text=" +
    encodeURIComponent(message);


  localStorage.removeItem("cart");

  localStorage.removeItem("checkoutCart");


  document.getElementById("loadingOverlay").style.display = "none";


  window.location.href = whatsapp;
}
</script>

</body>
</html>
