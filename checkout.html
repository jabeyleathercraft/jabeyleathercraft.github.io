<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - Jabey Leather Craft</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f5f0;
      color: #222;
    }

    .checkout-box {
      max-width: 500px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    textarea {
      min-height: 90px;
    }

    .buy-button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 6px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #222;
    }
  </style>
</head>

<body>

  <div class="checkout-box">

    <h1>Checkout</h1>

    <p><strong>Product:</strong> <span id="productName">Your Product</span></p>
    <p><strong>Price:</strong> MVR <span id="productPrice">0</span></p>

    <label>Quantity</label>
    <input type="number" id="quantity" value="1" min="1">

    <label>Full Name</label>
    <input type="text" id="customerName" required>

    <label>Phone Number</label>
    <input type="tel" id="customerPhone" required>

    <label>Delivery Address</label>
<textarea id="customerAddress" required></textarea>

<label>Payment Method</label>

<select id="paymentMethod" onchange="showPaymentDetails()">
  <option value="">Select Payment Method</option>
  <option value="bml">BML Bank Transfer</option>
  <option value="mib">MIB Bank Transfer</option>
  <option value="cod">Cash on Delivery</option>
</select>

<div id="bankDetails" style="display:none; margin-top:20px; padding:15px; background:#f5f5f5; border-radius:8px;">

  <p><strong>Bank Transfer Details</strong></p>

  <p id="bmlDetails" style="display:none;">
    <strong>BML</strong><br>
    Account Name: Jazlaan Mohamed<br>
    Account Number: 7730000298250
  </p>

  <p id="mibDetails" style="display:none;">
    <strong>MIB</strong><br>
    Account Name: Jazlaan Mohamed<br>
    Account Number: 90403101000351000
  </p>

  <label>Upload Payment Slip</label>
  <input type="file" id="paymentSlip" accept="image/*,.pdf">

</div>

<div id="codDetails" style="display:none; margin-top:20px; padding:15px; background:#f5f5f5; border-radius:8px;">
  <strong>Cash on Delivery</strong>
  <p>You can pay when your order is delivered.</p>
</div>

<button class="buy-button" onclick="placeOrder()">
  PLACE ORDER
</button>

    <a href="index.html" class="back">← Back to Shop</a>

  </div>

  <script>
const SUPABASE_URL = "https://gdgamwhbhsfhotkyuqpm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkZ2Ftd2hiaHNmaG90a3l1cXBtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk0MTIxNzIsImV4cCI6MjEwNDk4ODE3Mn0.rARsQRMObsq0efhIWldRvekr21QRAzt-YOGPayQxGMM";
    const ORDERS_URL =
  SUPABASE_URL + "/rest/v1/orders";
const UPLOAD_FUNCTION_URL =
  SUPABASE_URL + "/functions/v1/Upload-payment-slip";
    const params = new URLSearchParams(window.location.search);

    const product = params.get("product") || "Your Product";
    const price = Number(params.get("price")) || 0;

    document.getElementById("productName").textContent = product;
    document.getElementById("productPrice").textContent = price;
function showPaymentDetails() {

  const paymentMethod =
    document.getElementById("paymentMethod").value;

  const bankDetails =
    document.getElementById("bankDetails");

  const bmlDetails =
    document.getElementById("bmlDetails");

  const mibDetails =
    document.getElementById("mibDetails");

  const codDetails =
    document.getElementById("codDetails");

  bankDetails.style.display = "none";
  bmlDetails.style.display = "none";
  mibDetails.style.display = "none";
  codDetails.style.display = "none";

  if (paymentMethod === "bml") {
    bankDetails.style.display = "block";
    bmlDetails.style.display = "block";
  }

  if (paymentMethod === "mib") {
    bankDetails.style.display = "block";
    mibDetails.style.display = "block";
  }

  if (paymentMethod === "cod") {
    codDetails.style.display = "block";
  }
}
    async function placeOrder() {

  const quantity =
    document.getElementById("quantity").value;

  const name =
    document.getElementById("customerName").value;

  const phone =
    document.getElementById("customerPhone").value;

  const address =
    document.getElementById("customerAddress").value;

  const paymentMethod =
    document.getElementById("paymentMethod").value;

  const paymentSlipInput =
  document.getElementById("paymentSlip");

const paymentSlip =
  paymentSlipInput ? paymentSlipInput.files[0] : null;

  if (!name || !phone || !address) {
    alert("Please fill in all your details.");
    return;
  }

  if (!paymentMethod) {
    alert("Please select a payment method.");
    return;
  }

  if (
    (paymentMethod === "bml" || paymentMethod === "mib")
    && !paymentSlip
  ) {
    alert("Please upload your payment slip.");
    return;
  }

  const orderNumber =
    "JLC-" +
    Date.now().toString().slice(-8);

  const total = price * quantity;

  let paymentText = "";

  if (paymentMethod === "bml") {
    paymentText = "BML Bank Transfer";
  }

  if (paymentMethod === "mib") {
    paymentText = "MIB Bank Transfer";
  }

  if (paymentMethod === "cod") {
    paymentText = "Cash on Delivery";
  }

  let slipFileName = "";

  if (paymentSlip) {

    try {

      const formData = new FormData();

      formData.append("file", paymentSlip);

      const response = await fetch(
        UPLOAD_FUNCTION_URL,
        {
          method: "POST",
          headers: {
            "Authorization":
              "Bearer " + SUPABASE_ANON_KEY,
            "apikey":
              SUPABASE_ANON_KEY
          },
          body: formData
        }
      );

      const result = await response.json();

      if (!response.ok) {
        throw new Error(
          result.error || "Upload failed."
        );
      }

      slipFileName = result.fileName;

    } catch (error) {

      alert(
        "UPLOAD ERROR: " + error.message
      );

      return;
    }
  }

  const orderData = {
    order_number: orderNumber,
    product: product,
    price: price,
    quantity: Number(quantity),
    total: total,
    customer_name: name,
    customer_phone: phone,
    delivery_address: address,
    payment_method: paymentText,
    payment_slip: slipFileName
  };

  try {

    const orderResponse = await fetch(
      ORDERS_URL,
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_ANON_KEY,
          "Authorization":
            "Bearer " + SUPABASE_ANON_KEY,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(orderData)
      }
    );

    if (!orderResponse.ok) {

      const errorText =
        await orderResponse.text();

      throw new Error(
        errorText || "Order could not be saved."
      );
    }

  } catch (error) {

    alert(
      "ORDER ERROR: " + error.message
    );

    return;
  }

  const message =
    "NEW ORDER - JABEY LEATHER CRAFT\n\n" +
    "Order Number: " + orderNumber + "\n" +
    "Product: " + product + "\n" +
    "Price: MVR " + price + "\n" +
    "Quantity: " + quantity + "\n" +
    "Total: MVR " + total + "\n\n" +
    "Customer: " + name + "\n" +
    "Phone: " + phone + "\n" +
    "Address: " + address + "\n\n" +
    "Payment Method: " + paymentText + "\n" +
    (slipFileName
      ? "Payment Slip: Uploaded\n"
      : "Payment Slip: Not Required");

  const whatsapp =
    "https://wa.me/9609878207?text=" +
    encodeURIComponent(message);

  window.location.href = whatsapp;
}

  </script>

</body>
</html>
