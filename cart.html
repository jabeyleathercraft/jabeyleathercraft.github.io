<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cart - Jabey Leather Craft</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f5f2;
      color: #222;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: #111;
      color: white;
    }

    .logo {
      width: 120px;
      max-width: 60%;
      height: auto;
    }

    h1 {
      margin: 10px 0 0;
      font-size: 24px;
    }

    .cart-container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .cart-item {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-weight: bold;
      font-size: 18px;
    }

    .item-price {
      margin-top: 5px;
      color: #666;
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity-controls button {
      width: 32px;
      height: 32px;
      border: none;
      background: #111;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    .remove-button {
      background: none;
      border: none;
      color: #b00020;
      cursor: pointer;
    }

    .cart-total {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      text-align: right;
    }

    .checkout-button {
      display: block;
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      background: #111;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 6px;
      box-sizing: border-box;
    }

    .empty-cart {
      text-align: center;
      padding: 50px 20px;
      background: white;
      border-radius: 8px;
    }

    .continue-shopping {
      display: inline-block;
      margin-top: 15px;
      color: #111;
    }
  </style>
</head>

<body>

  <header>
    <img src="logo.jpg.png" alt="Jabey Leather Craft" class="logo">
    <h1>Your Cart</h1>
  </header>

  <div class="cart-container">

    <div id="cartItems"></div>

    <div id="cartTotal"></div>

  </div>

  <script>

    function getCart() {
      return JSON.parse(
        localStorage.getItem("jabeyCart")
      ) || [];
    }

    function saveCart(cart) {
      localStorage.setItem(
        "jabeyCart",
        JSON.stringify(cart)
      );
    }

    function displayCart() {

      const cart = getCart();

      const cartItems =
        document.getElementById("cartItems");

      const cartTotal =
        document.getElementById("cartTotal");

      if (cart.length === 0) {

        cartItems.innerHTML = `
          <div class="empty-cart">
            <h2>Your cart is empty</h2>
            <p>Add some leather goods to your cart.</p>
            <a href="index.html" class="continue-shopping">
              Continue Shopping
            </a>
          </div>
        `;

        cartTotal.innerHTML = "";

        return;
      }

      let total = 0;

      cartItems.innerHTML = "";

      cart.forEach((item, index) => {

        const itemTotal =
          item.price * item.quantity;

        total += itemTotal;

        cartItems.innerHTML += `
          <div class="cart-item">

            <div class="item-info">
              <div class="item-name">
                ${item.name}
              </div>

              <div class="item-price">
                MVR ${item.price}
              </div>
            </div>

            <div class="quantity-controls">

              <button onclick="changeQuantity(${index}, -1)">
                -
              </button>

              <span>
                ${item.quantity}
              </span>

              <button onclick="changeQuantity(${index}, 1)">
                +
              </button>

            </div>

            <button
              class="remove-button"
              onclick="removeItem(${index})">
              Remove
            </button>

          </div>
        `;
      });

      cartTotal.innerHTML = `
        <div class="cart-total">
          Total: MVR ${total}
        </div>

        <a
          href="checkout.html"
          class="checkout-button">
          CHECKOUT
        </a>
      `;
    }

    function changeQuantity(index, change) {

      const cart = getCart();

      cart[index].quantity += change;

      if (cart[index].quantity <= 0) {
        cart.splice(index, 1);
      }

      saveCart(cart);

      displayCart();
    }

    function removeItem(index) {

      const cart = getCart();

      cart.splice(index, 1);

      saveCart(cart);

      displayCart();
    }

    displayCart();

  </script>

</body>
</html>
