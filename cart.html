<!DOCTYPE html>
<html lang="en">

<head>

    <!-- =========================
         BASIC PAGE SETTINGS
    ========================== -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cart | Jabey Leather Craft</title>


    <!-- =========================
         CART PAGE STYLES
    ========================== -->

    <style>

        /* =========================
           GLOBAL
        ========================== */

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;

            background: #f6f2ec;

            color: #241811;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        /* =========================
           HEADER
        ========================== */

        header {
            padding: 30px 20px 24px;

            text-align: center;

            background: #f6f2ec;

            border-bottom: 1px solid #d7c7b7;
        }


        header h1 {
            margin: 0;

            font-size: 25px;

            font-weight: normal;

            letter-spacing: 5px;

            text-transform: uppercase;
        }


        header p {
            margin: 8px 0 0;

            color: #8a6040;

            font-size: 11px;

            letter-spacing: 3px;

            text-transform: uppercase;
        }


        /* =========================
           NAVIGATION
        ========================== */

        .navigation {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 14px;

            padding: 20px;

            background: #f6f2ec;

            border-bottom: 1px solid #d7c7b7;
        }


        .navigation a {
            color: #241811;

            text-decoration: none;

            font-size: 13px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            transition:
                color 0.2s ease;
        }


        .navigation a:hover {
            color: #8a6040;
        }


        .navigation span {
            color: #8a6040;

            font-size: 13px;
        }


        /* =========================
           PAGE TITLE
        ========================== */

        .cart-header {
            max-width: 900px;

            margin: 0 auto;

            padding: 75px 25px 45px;

            text-align: center;
        }


        .section-label {
            margin-bottom: 18px;

            color: #8a6040;

            font-size: 11px;

            letter-spacing: 4px;

            text-transform: uppercase;
        }


        .cart-header h2 {
            margin: 0;

            font-size: clamp(35px, 5vw, 52px);

            font-weight: normal;
        }


        .cart-header p {
            margin: 18px 0 0;

            color: #765d49;

            font-size: 15px;
        }


        /* =========================
           CART CONTAINER
        ========================== */

        #cartContainer {
            max-width: 900px;

            margin: 0 auto;

            padding: 0 25px 100px;
        }


        /* =========================
           CART ITEM
        ========================== */

        .cart-item {
            padding: 28px 0;

            border-top: 1px solid #d7c7b7;
        }


        .cart-item:last-of-type {
            border-bottom: 1px solid #d7c7b7;
        }


        .cart-item h3 {
            margin: 0 0 12px;

            font-size: 22px;

            font-weight: normal;
        }


        .cart-item p {
            margin: 7px 0;

            color: #765d49;

            font-size: 14px;

            line-height: 1.5;
        }


        .cart-item strong {
            color: #241811;
        }


        /* =========================
           QUANTITY CONTROLS
        ========================== */

        .quantity-controls {
            display: flex;

            align-items: center;

            gap: 18px;

            margin-top: 20px;
        }


        .quantity-controls button {
            width: 34px;

            height: 34px;

            border: 1px solid #241811;

            background: transparent;

            color: #241811;

            font-family: Georgia, serif;

            font-size: 18px;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .quantity-controls button:hover {
            background: #241811;

            color: white;
        }


        .quantity-controls span {
            min-width: 20px;

            text-align: center;

            font-size: 15px;
        }


        /* =========================
           REMOVE BUTTON
        ========================== */

        .remove-button {
            margin-top: 18px;

            padding: 8px 0;

            border: none;

            background: transparent;

            color: #8a6040;

            font-family: Georgia, serif;

            font-size: 11px;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            cursor: pointer;
        }


        .remove-button:hover {
            color: #241811;

            text-decoration: underline;
        }


        /* =========================
           ORDER SUMMARY
        ========================== */

        .cart-summary {
            margin-top: 45px;

            padding: 30px;

            background: #ebe3d9;

            border: 1px solid #d7c7b7;
        }


        .cart-summary h3 {
            margin: 0 0 22px;

            font-size: 14px;

            letter-spacing: 3px;

            font-weight: normal;

            text-transform: uppercase;
        }


        .total {
            margin-bottom: 25px;

            font-size: 25px;
        }


        /* =========================
           CHECKOUT BUTTON
        ========================== */

        .checkout-button {
            width: 100%;

            padding: 16px;

            border: 1px solid #241811;

            background: #241811;

            color: white;

            font-family: Georgia, serif;

            font-size: 12px;

            letter-spacing: 2px;

            text-transform: uppercase;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .checkout-button:hover {
            background: transparent;

            color: #241811;
        }


        /* =========================
           EMPTY CART
        ========================== */

        .empty-cart {
            padding: 80px 20px 100px;

            text-align: center;
        }


        .empty-cart h3 {
            margin: 0;

            font-size: 30px;

            font-weight: normal;
        }


        .empty-cart p {
            margin: 15px 0 30px;

            color: #765d49;
        }


        .shop-button {
            display: inline-block;

            padding: 14px 25px;

            border: 1px solid #241811;

            color: #241811;

            text-decoration: none;

            font-size: 12px;

            letter-spacing: 2px;

            text-transform: uppercase;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }


        .shop-button:hover {
            background: #241811;

            color: white;
        }


        /* =========================
           FOOTER
        ========================== */

        footer {
            padding: 35px 20px;

            background: #f6f2ec;

            border-top: 1px solid #d7c7b7;

            text-align: center;

            color: #765d49;

            font-size: 12px;

            letter-spacing: 1px;
        }


        footer p {
            margin: 7px 0;
        }


        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            header h1 {
                font-size: 22px;

                letter-spacing: 4px;
            }


            .navigation {
                gap: 8px;

                padding: 18px 8px;
            }


            .navigation a {
                font-size: 10px;

                letter-spacing: 0.8px;
            }


            .navigation span {
                font-size: 10px;
            }


            .cart-header {
                padding: 60px 20px 35px;
            }


            #cartContainer {
                padding:
                    0 20px 70px;
            }


            .cart-item h3 {
                font-size: 20px;
            }


            .cart-summary {
                padding: 25px 20px;
            }

        }

    </style>

</head>


<body>


    <!-- ==================================================
         HEADER
    =================================================== -->

    <header>

        <h1>
            Jabey
        </h1>

        <p>
            Leather Craft
        </p>

    </header>



    <!-- ==================================================
         NAVIGATION
    =================================================== -->

    <nav class="navigation">

        <a href="index.html">
            Home
        </a>

        <span>|</span>

        <a href="shop.html">
            Shop
        </a>

        <span>|</span>

        <a href="index.html#about">
            About
        </a>

        <span>|</span>

        <a href="index.html#custom">
            Custom
        </a>

        <span>|</span>

        <a href="cart.html">
            Cart
        </a>

    </nav>



    <!-- ==================================================
         CART TITLE
    =================================================== -->

    <section class="cart-header">

        <div class="section-label">
            Your Selection
        </div>

        <h2>
            Shopping Cart
        </h2>

        <p>
            Review your handcrafted pieces before checkout.
        </p>

    </section>



    <!-- ==================================================
         CART CONTENT
    =================================================== -->

    <div id="cartContainer"></div>



    <!-- ==================================================
         FOOTER
    =================================================== -->

    <footer>

        <p>
            Handcrafted in Maldives
        </p>

        <p>
            © 2026 Jabey Leather Craft
        </p>

    </footer>



    <!-- ==================================================
         CART JAVASCRIPT
         FUNCTIONALITY KEPT THE SAME
    =================================================== -->

    <script>

        function loadCart() {

            const cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            const container =
                document.getElementById("cartContainer");

            container.innerHTML = "";


            /* =========================
               EMPTY CART
            ========================== */

            if (cart.length === 0) {

                container.innerHTML = `

                    <div class="empty-cart">

                        <h3>
                            Your cart is empty.
                        </h3>

                        <p>
                            Add something from our collection.
                        </p>

                        <a
                            href="shop.html"
                            class="shop-button"
                        >
                            SHOP COLLECTION
                        </a>

                    </div>

                `;

                return;
            }


            /* =========================
               CART ITEMS
            ========================== */

            let total = 0;


            cart.forEach(function(item, index) {

                const itemTotal =
                    item.price * item.quantity;

                total += itemTotal;


                const div =
                    document.createElement("div");


                div.className = "cart-item";


                div.innerHTML = `

                    <h3>
                        ${item.product}
                    </h3>

                    <p>
                        Price: MVR ${item.price}
                    </p>

                    <p>
                        Color: ${item.color}
                    </p>

                    <p>
                        Customisation:
                        ${item.customisation || "None"}
                    </p>

                    <p>
                        Item Total:
                        <strong>
                            MVR ${itemTotal}
                        </strong>
                    </p>


                    <div class="quantity-controls">

                        <button
                            onclick="changeQuantity(${index}, -1)"
                        >
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="changeQuantity(${index}, 1)"
                        >
                            +
                        </button>

                    </div>


                    <button
                        class="remove-button"
                        onclick="removeItem(${index})"
                    >
                        REMOVE
                    </button>

                `;


                container.appendChild(div);

            });


            /* =========================
               ORDER SUMMARY
            ========================== */

            const summary =
                document.createElement("div");


            summary.className =
                "cart-summary";


            summary.innerHTML = `

                <h3>
                    Order Summary
                </h3>

                <div class="total">
                    Total: MVR ${total}
                </div>

                <button
                    class="checkout-button"
                    onclick="goToCheckout()"
                >
                    Proceed to Checkout
                </button>

            `;


            container.appendChild(summary);

        }



        /* =========================
           CHANGE QUANTITY
        ========================== */

        function changeQuantity(index, change) {

            const cart =
                JSON.parse(localStorage.getItem("cart")) || [];


            cart[index].quantity += change;


            if (cart[index].quantity < 1) {

                cart[index].quantity = 1;

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            loadCart();

        }



        /* =========================
           REMOVE ITEM
        ========================== */

        function removeItem(index) {

            const cart =
                JSON.parse(localStorage.getItem("cart")) || [];


            cart.splice(index, 1);


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            loadCart();

        }



        /* =========================
           PROCEED TO CHECKOUT
        ========================== */

        function goToCheckout() {

            const cart =
                JSON.parse(localStorage.getItem("cart")) || [];


            if (cart.length === 0) {

                alert("Your cart is empty.");

                return;

            }


            localStorage.setItem(
                "checkoutCart",
                JSON.stringify(cart)
            );


            window.location.href =
                "checkout.html";

        }



        /* =========================
           LOAD CART
        ========================== */

        loadCart();

    </script>


</body>

</html>
