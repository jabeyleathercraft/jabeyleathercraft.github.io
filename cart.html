<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart - Jabey Leather Craft</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
            background: #f5efe6;
            color: #241811;
        }

        header {
            background: #241811;
            color: white;
            padding: 25px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: 3px;
        }

        header p {
            margin: 7px 0 0;
            color: #c9a77d;
            font-size: 12px;
            letter-spacing: 3px;
        }

        nav {
            background: #3a271c;
            padding: 15px 12px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 14px;
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        main {
            max-width: 900px;
            margin: auto;
            padding: 50px 20px;
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h2 {
            font-size: 32px;
            margin: 0 0 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .title p {
            color: #765033;
        }

        .cart-item {
            background: #fffdf9;
            border: 1px solid #d8c8b7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(36, 24, 17, 0.08);
        }

        .cart-item h3 {
            margin: 0 0 8px;
            font-size: 18px;
        }

        .cart-item p {
            margin: 5px 0;
            color: #765033;
            font-size: 14px;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 12px;
        }

        .quantity-controls button {
            width: 32px;
            height: 32px;
            border: 1px solid #241811;
            background: transparent;
            color: #241811;
            cursor: pointer;
            border-radius: 4px;
            font-size: 18px;
        }

        .quantity-controls span {
            min-width: 20px;
            text-align: center;
            font-weight: bold;
        }

        .remove-button {
            margin-top: 12px;
            padding: 8px 14px;
            background: transparent;
            color: #8b3a2f;
            border: 1px solid #8b3a2f;
            border-radius: 4px;
            cursor: pointer;
            font-family: Georgia, serif;
        }

        .remove-button:hover {
            background: #8b3a2f;
            color: white;
        }

        .cart-summary {
            background: #241811;
            color: white;
            padding: 25px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .cart-summary h3 {
            margin: 0 0 15px;
            letter-spacing: 2px;
        }

        .total {
            font-size: 22px;
            color: #c9a77d;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .checkout-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            background: #c9a77d;
            color: #241811;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            letter-spacing: 1.5px;
        }

        .checkout-button:hover {
            background: #e0c49f;
        }

        .empty-cart {
            text-align: center;
            padding: 50px 20px;
            color: #765033;
        }

        .shop-button {
            display: inline-block;
            margin-top: 20px;
            padding: 13px 22px;
            background: #241811;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        footer {
            background: #17100c;
            color: white;
            text-align: center;
            padding: 35px 20px;
            margin-top: 40px;
        }

        footer p {
            margin: 6px 0;
            color: #c9a77d;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            main {
                padding: 40px 15px;
            }

            .title h2 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>JABEY LEATHER CRAFT</h1>
    <p>YOUR CART</p>
</header>

<nav>
    <a href="index.html">Shop</a>
    <a href="cart.html">Cart</a>
</nav>

<main>

    <div class="title">
        <h2>Your Cart</h2>
        <p>Review your handcrafted leather goods.</p>
    </div>

    <div id="cartContainer"></div>

</main>

<footer>
    <p>Handcrafted in the Maldives 🇲🇻</p>
    <p>© 2026 Jabey Leather Craft</p>
</footer>


<script>

function loadCart() {

    const cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    const container =
        document.getElementById("cartContainer");

    container.innerHTML = "";

    if (cart.length === 0) {

        container.innerHTML = `
            <div class="empty-cart">
                <h3>Your cart is empty.</h3>
                <p>Add something from our collection.</p>
                <a href="index.html" class="shop-button">
                    SHOP COLLECTION
                </a>
            </div>
        `;

        return;
    }

    let total = 0;

    cart.forEach(function(item, index) {

        const itemTotal =
            item.price * item.quantity;

        total += itemTotal;

        const div =
            document.createElement("div");

        div.className = "cart-item";

        div.innerHTML = `
            <h3>${item.product}</h3>

            <p>Price: MVR ${item.price}</p>

            <p>Color: ${item.color}</p>

            <p>
                Customisation:
                ${item.customisation || "None"}
            </p>

            <p>
                Item Total:
                <strong>MVR ${itemTotal}</strong>
            </p>

            <div class="quantity-controls">

                <button onclick="changeQuantity(${index}, -1)">
                    −
                </button>

                <span>${item.quantity}</span>

                <button onclick="changeQuantity(${index}, 1)">
                    +
                </button>

            </div>

            <button
                class="remove-button"
                onclick="removeItem(${index})">
                REMOVE
            </button>
        `;

        container.appendChild(div);

    });

    const summary =
        document.createElement("div");

    summary.className = "cart-summary";

    summary.innerHTML = `
        <h3>ORDER SUMMARY</h3>

        <div class="total">
            Total: MVR ${total}
        </div>

      <button class="checkout-button" onclick="goToCheckout()">
    PROCEED TO CHECKOUT
</button>
    `;

    container.appendChild(summary);
}


function changeQuantity(index, change) {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    cart[index].quantity += change;

    if (cart[index].quantity < 1) {
        cart[index].quantity = 1;
    }

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    loadCart();
}


function removeItem(index) {

    let cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    cart.splice(index, 1);

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    loadCart();
}
function goToCheckout() {

    const cart =
        JSON.parse(localStorage.getItem("cart")) || [];

    if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
    }

    localStorage.setItem(
        "checkoutCart",
        JSON.stringify(cart)
    );

    window.location.href = "checkout.html";
}
loadCart();

</script>

</body>
</html>
